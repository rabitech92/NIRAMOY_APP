<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout('বিক্রয় ও POS', ~{::content})}">
<body>
<div th:fragment="content">
    <div class="page-head">
        <div><h1>বিক্রয় ও POS</h1><p class="muted">বারকোড স্ক্যান করুন বা নাম লিখে খুঁজুন। FEFO অনুযায়ী আগে মেয়াদ শেষ হবে এমন ব্যাচ আগে দেখায়।</p></div>
        <button type="button" class="btn" id="restoreHeld">ধরে রাখা বিক্রয়</button>
    </div>

    <div class="alert warn" th:if="${activeBranchId == null}">
        POS ব্যবহারের জন্য ওপরের ড্রপডাউন থেকে একটি নির্দিষ্ট শাখা নির্বাচন করুন।
    </div>

    <div th:unless="${activeBranchId == null}" id="pos" th:attr="data-vat=${vat}" class="grid cols-2">
        <div class="card pad">
            <h2 class="mb">ওষুধ খুঁজুন</h2>
            <label class="label" for="posSearch">নাম বা বারকোড</label>
            <input id="posSearch" class="field" autocomplete="off" autofocus placeholder="নাম লিখুন বা বারকোড স্ক্যান করুন">
            <div id="posResults" class="mt" style="max-height:460px;overflow:auto"></div>
        </div>

        <div class="card pad">
            <h2>বর্তমান কার্ট</h2>
            <p class="muted small mb">দাম ও VAT সার্ভার থেকে নিশ্চিত করা হয়</p>
            <div id="cartItems"></div>

            <div class="grid cols-2 mt">
                <div><label class="label" for="discount">ছাড় (৳)</label>
                    <input id="discount" class="field" type="number" min="0" step="0.01" value="0"></div>
                <div><label class="label" for="payment">পেমেন্ট পদ্ধতি</label>
                    <select id="payment" class="field">
                        <option th:each="p : ${paymentMethods}" th:value="${p.name()}" th:text="${p.label}"></option>
                    </select></div>
            </div>
            <div class="grid cols-2 mt">
                <div><label class="label" for="paid">পরিশোধ (৳) — কম দিলে বাকিটা বকেয়া হবে</label>
                    <input id="paid" class="field" type="number" min="0" step="0.01" placeholder="সম্পূর্ণ পরিশোধ"></div>
                <div style="display:flex;align-items:flex-end"><button type="button" class="btn" id="payFull">সম্পূর্ণ পরিশোধ</button></div>
            </div>
            <div class="grid cols-2 mt">
                <div><label class="label" for="custName">গ্রাহকের নাম *</label>
                    <input id="custName" class="field" maxlength="100" autocomplete="off" required></div>
                <div><label class="label" for="custPhone">মোবাইল নম্বর *</label>
                    <input id="custPhone" class="field" type="tel" inputmode="numeric" maxlength="16"
                           placeholder="01XXXXXXXXX" autocomplete="off" required></div>
            </div>

            <div id="cartTotal" class="totals mt"></div>
            <div class="row gap wrap mt">
                <button type="button" class="btn" id="previewBtn">ইনভয়েস প্রিভিউ</button>
                <button type="button" class="btn" id="holdBtn">ধরে রাখুন</button>
                <button type="button" class="btn primary" id="checkoutBtn">বিক্রয় সম্পন্ন</button>
            </div>
        </div>
    </div>

    <dialog id="previewDialog" class="modal">
        <h2>ইনভয়েস প্রিভিউ</h2>
        <p class="muted small mb">এখনো বিক্রয় সম্পন্ন হয়নি</p>
        <div id="previewBody"></div>
        <div class="row gap mt"><button type="button" class="btn" id="closePreview">বন্ধ করুন</button></div>
    </dialog>

    <script th:src="@{/js/pos.js}"></script>
</div>
</body>
</html>
