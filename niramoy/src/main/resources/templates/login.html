<!DOCTYPE html>
<html lang="bn" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>লগইন · নিরাময়</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="login-wrap">
    <div class="card login-card">
        <div class="brand" style="padding:0 0 20px">
            <span class="logo" style="background:#13865a22;color:#13865a">✚</span>
            <div><strong style="color:var(--navy);font-size:20px">নিরাময়</strong><small class="muted">ফার্মেসি ব্যবস্থাপনা</small></div>
        </div>
        <div class="alert bad" th:if="${param.error}" role="alert">ইউজারনেম বা পাসওয়ার্ড সঠিক নয়, অথবা অ্যাকাউন্টটি নিষ্ক্রিয়।</div>
        <div class="alert good" th:if="${param.logout}" role="status">আপনি সফলভাবে লগআউট করেছেন।</div>
        <form th:action="@{/login}" method="post">
            <div class="fld"><label class="label" for="username">ইউজারনেম</label>
                <input class="field" id="username" name="username" autocomplete="username" required autofocus></div>
            <div class="fld"><label class="label" for="password">পাসওয়ার্ড</label>
                <input class="field" id="password" name="password" type="password" autocomplete="current-password" required></div>
            <button type="submit" class="btn primary" style="width:100%">লগইন করুন</button>
        </form>
    </div>
</div>
</body>
</html>
