name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # android/ ফোল্ডার রিপোজিটরিতে রাখা হয় না, তাই প্রতিবার তৈরি করা হয়
      - name: Create Android platform files
        run: flutter create --platforms=android --org com.niramoy --project-name niramoy_pharmacy .

      - name: Apply manifest (INTERNET permission, app name)
        run: cp android_overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      # secure storage ও ক্যামেরা স্ক্যানারের জন্য minSdk ২৪ (Android 7.0+) দরকার
      - name: Set minSdk 24
        run: |
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then sed -i 's/flutter\.minSdkVersion/24/' "$f"; fi
          done

      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: niramoy-apk
          path: build/app/outputs/flutter-apk/app-release.apk
